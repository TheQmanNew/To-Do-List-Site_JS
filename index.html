<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="Web-ToDo.css">
</head>
<body background="oblaka-volny-abstraktsiia.jpg">
    <div class="container">
        <h1>To Do List</h1>
        <form id="task-form">
            <input type="text" id="task-input" placeholder="Введите новую задачу">
            <button type="submit">Добавить</button>
        </form>
        <ul id="task-list"></ul>
    </div>
    <script src="Web-ToDo.js"></script> 
</body>
</html>
